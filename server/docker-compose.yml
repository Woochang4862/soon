version: '3.5'

services:
  mysql:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ./data/mysql:/var/lib/mysql
    # TODO: bin/www.js > creat_db.js 에서 connection error 발생 : healthcheck 로 해결해보기
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "1"

  redis:
    image: redis:latest
    volumes:
      - ./data/redis:/data
    logging:
      driver: "json-file"
      options:
        max-size: "15m"
        max-file: "1"

  node-app:
    build: .
    volumes:
      - ./:/soon-server-side
      - ./secrets:/soon-server-side/secrets:ro   # 서비스 계정 키 (저장소 밖, 읽기 전용)
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      MYSQL_HOST: mysql
      GOOGLE_APPLICATION_CREDENTIALS: /soon-server-side/secrets/firebase-sa.json
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "60m"
        max-file: "1"

